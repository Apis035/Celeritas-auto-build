name: Auto Releases

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"


permissions:
  contents: write


jobs:
  build:
    name: Check, build, release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Clone Celeritas
        run: git clone --depth:1 https://git.taumc.org/embeddedt/celeritas.git


      - name: Check for updates
        id: check
        working-directory: ./celeritas
        run: |
          CURRENT_COMMIT=$(git rev-parse HEAD)
          PREVIOUS_COMMIT=$(cat ../latest_commit)

          echo "Current commit: $CURRENT_COMMIT"
          echo "Previous commit: $PREVIOUS_COMMIT"

          if [[ "$CURRENT_COMMIT" == "$PREVIOUS_COMMIT" ]]; then
            echo "Celeritas has not changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Celeritas has changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"


      - name: Stop if Celeritas has no updates
        if: steps.check.outputs.changed == 'false'
        run: echo "Nothing to build."


      - name: Get release information
        if: steps.check.outputs.changed == 'true'
        working-directory: ./celeritas
        run: |
          echo "LATEST_DESCRIBE=$(git describe --tags)" >> "$GITHUB_ENV"
          echo "CURRENT_DATE=$(date +'%Y%m%dT%H%M%S')" >> "$GITHUB_ENV"


      - name: Create release notes
        if: steps.check.outputs.changed == 'true'
        working-directory: ./celeritas
        run: |
          CURRENT_COMMIT="${{ steps.check.outputs.commit }}"
          PREVIOUS_COMMIT=$(cat ../latest_commit)

          echo "Built on commit: [${CURRENT_COMMIT}](https://git.taumc.org/embeddedt/celeritas/commit/${CURRENT_COMMIT})" > body.txt
          echo >> body.txt

          git rev-list "$PREVIOUS_COMMIT^..$CURRENT_COMMIT" --pretty >> body.txt


      - name: Set up JDK 8
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin

      - name: Set up JDK 21
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin


      - name: Build all versions
        if: steps.check.outputs.changed == 'true'
        working-directory: ./celeritas
        run: |
          chmod +x ./celeritas/gradlew
          ./gradlew -Pceleritas_target_versions_pattern=.* packageJar


      - name: Update latest commit hash
        if: steps.check.outputs.changed == 'true'
        run: echo "${{ steps.check.outputs.commit }}" > latest_commit


      - name: Commit latest commit hash
        if: steps.check.outputs.changed == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          add: latest_commit
          push: true
          tag: "${{ env.LATEST_DESCRIBE }}-${{ env.CURRENT_DATE }}"


      - name: Create GitHub release
        if: steps.check.outputs.changed == 'true'
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "celeritas/build/libs/**/*.jar"
          bodyFile: "celeritas/body.txt"
          generateReleaseNotes: false
          tag: "${{ env.LATEST_DESCRIBE }}-${{ env.CURRENT_DATE }}"
